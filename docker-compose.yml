services:
  mongodb:
    image: mongo:7.0
    container_name: farmprice_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: farmprice_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=farmpriceNepal
      - JWT_SECRET=your-super-secret-key-change-in-production
    depends_on:
      - mongodb
    volumes:
      - ./backend:/code

  frontend:
    build: ./frontend
    container_name: farmprice_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
